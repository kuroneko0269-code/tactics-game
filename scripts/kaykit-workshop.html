<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>人形の工房</title>
    <style>
      body { margin: 0; background: #1b1b20; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <canvas id="out"></canvas>
    <canvas id="gray"></canvas>
    <script type="module">
      // 人形の工房: 髪の案（A・B・C）を、1枚の画像に横に並べて撮るための、開発用サーバーだけで開くページ（scripts/kaykit-workshop.mjs）。
      // ?who=touma|yuna &round=往復の番号 &kind=views（案ごとに6つの向き）| small（場面4でスマホに映る大きさの全身）
      import * as THREE from 'three';
      import { createKayKitPuppet, loadKayKit } from '/src/render/kaykit.ts';
      import { LOOKS } from '/src/data/story/looks.ts';
      import { GESTURES } from '/src/data/story/stageDefs.ts';
      import { playGesture } from '/src/render/motion.ts';
      import { createTweens } from '/src/render/tweens.ts';
      import { VARIANTS, NAMES, DECIDED } from '/scripts/kaykit-workshop-variants.js';
      import { DEFAULT_LOOK } from '/src/data/story/looks.ts';

      const q = new URLSearchParams(location.search);
      const who = q.get('who') ?? 'touma';
      const kind = q.get('kind') ?? 'views';
      const round = q.get('round') ?? '1';
      const names = NAMES;
      /** 案の見た目: looks.ts の見た目に、案の値を重ねる（KayKit の見た目がまだ無い人物は、案の look をそのまま使う） */
      const lookOf = (id, v = {}) => {
        const base = LOOKS[id] ?? DEFAULT_LOOK;
        const bk = base.kaykit;
        const kk = bk ? { ...bk, ...(v.look ?? {}), hair: { ...bk.hair, ...(v.look?.hair ?? {}) } } : v.look;
        return { ...base, ...(v.def ?? {}), kaykit: kk };
      };
      // 並び（lineup）: 決まった人物と、この往復の案を、スマホに映る大きさで横に並べる
      const lineup = kind === 'lineup';
      const list = lineup
        ? [
            ...DECIDED.map((id) => ({ id, name: names[id], sub: '決定', v: {} })),
            ...who.split(',').flatMap((id) => VARIANTS[id][round].map((v) => ({ id, name: names[id], sub: v.name.split(' ')[0], v }))),
          ]
        : VARIANTS[who][round];
      if (lineup) {
        await renderLineup();
      }

      async function renderLineup() {
        const CW = 104, CH = 160, HEAD = 8, FOOT = 40;
        const W = list.length * CW;
        const H = HEAD + CH + FOOT;
        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(CW, CH);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x8a7e6a);
        const hemi = new THREE.HemisphereLight(0xc8d4ff, 0x4a3a30, 1.5);
        const sun = new THREE.DirectionalLight(0xffe2bc, 2.2);
        sun.position.set(1.5, 3, 4);
        scene.add(hemi, sun);
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshLambertMaterial({ color: 0x6a5e4c }));
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);
        await loadKayKit();
        const out = document.getElementById('out');
        const dpr = window.devicePixelRatio;
        out.width = W * dpr;
        out.height = H * dpr;
        out.style.width = `${W}px`;
        out.style.height = `${H}px`;
        const ctx = out.getContext('2d');
        ctx.scale(dpr, dpr);
        ctx.fillStyle = '#1b1b20';
        ctx.fillRect(0, 0, W, H);
        const camera = new THREE.PerspectiveCamera(20, CW / CH, 0.05, 100);
        const e = THREE.MathUtils.degToRad(35);
        camera.position.set(0, 0.55 + Math.sin(e) * 4.2, Math.cos(e) * 4.2);
        camera.lookAt(0, 0.55, 0);
        for (const [i, item] of list.entries()) {
          const p = createKayKitPuppet(lookOf(item.id, item.v));
          scene.add(p.group);
          p.setYaw(0.45);
          for (let t = 0; t < 1.2; t += 1 / 30) p.update(t);
          renderer.render(scene, camera);
          const x = i * CW;
          ctx.drawImage(renderer.domElement, x, HEAD, CW, CH);
          ctx.textAlign = 'center';
          ctx.fillStyle = item.sub === '決定' ? '#c8c0aa' : '#ffe9a8';
          ctx.font = 'bold 14px sans-serif';
          ctx.fillText(item.name, x + CW / 2, HEAD + CH + 17);
          ctx.font = '12px sans-serif';
          ctx.fillText(item.sub, x + CW / 2, HEAD + CH + 33);
          scene.remove(p.group);
          if (i > 0 && list[i - 1].id !== item.id) {
            ctx.fillStyle = '#e8e2d0';
            ctx.fillRect(x - 1, 4, 2, H - 8);
          }
        }
        // 白黒の版（輪郭で見分けられるか）
        const gray = document.getElementById('gray');
        gray.width = out.width;
        gray.height = out.height;
        gray.style.width = out.style.width;
        gray.style.height = out.style.height;
        const g = gray.getContext('2d');
        g.filter = 'grayscale(1)';
        g.drawImage(out, 0, 0);
        document.title = `並び ${round}`;
        window.done = true;
      }
      if (lineup) throw new Error('lineup done');

      const small = kind === 'small';
      const body = q.get('frame') === 'body' || kind === 'trio';
      // 1つの画の大きさ（small は、場面4のスマホ縦向きで人物が映る大きさ: 背丈およそ 130 px）
      const CW = small ? 120 : kind === 'trio' ? 230 : 250;
      const CH = small ? 170 : kind === 'trio' ? 340 : 290;
      const trio = kind === 'trio';
      const views = trio
        ? [
            ['正面', 0],
            ['斜め前', 0.7],
            ['後ろ', Math.PI],
          ]
        : small
        ? [
            ['斜め前', 0.55],
            ['斜め後ろ', 2.5],
          ]
        : [
            ['正面', 0],
            ['斜め前', 0.7],
            ['横', Math.PI / 2],
            ['斜め後ろ', 2.4],
            ['後ろ', Math.PI],
            [who === 'touma' ? 'うつむく（見下ろし）' : '見下ろし（ゲームの角度）', 0.35, 'down'],
          ];
      const COLS = small ? 2 : 3;
      const ROWS = Math.ceil(views.length / COLS);
      const HEAD = 44;
      const GAP = 16;
      const BW = COLS * CW;
      const W = list.length * BW + (list.length - 1) * GAP;
      const H = HEAD + ROWS * CH + 6;

      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(CW, CH);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(small ? 0x5a4636 : 0x9a9080);
      const hemi = new THREE.HemisphereLight(0xc8d4ff, 0x4a3a30, 1.5);
      scene.add(hemi);
      const sun = new THREE.DirectionalLight(0xffe2bc, 2.2);
      sun.position.set(1.5, 3, 4);
      scene.add(sun);
      if (small) {
        // 場面4の夕食の光に近づける
        const { TIMES_OF_DAY } = await import('/src/data/lighting.ts');
        const { applyLighting } = await import('/src/render/lighting.ts');
        applyLighting(scene, { hemi, sun }, TIMES_OF_DAY['夕方'], undefined, 0.7);
        const lamp = new THREE.PointLight(0xffb070, 2.2, 6, 1.4);
        lamp.position.set(1.2, 1.4, 1.6);
        scene.add(lamp);
      }
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshLambertMaterial({ color: small ? 0x7a5a40 : 0x6a5e4c }));
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);
      await loadKayKit();

      const out = document.getElementById('out');
      const dpr = window.devicePixelRatio;
      out.width = W * dpr;
      out.height = H * dpr;
      out.style.width = `${W}px`;
      out.style.height = `${H}px`;
      const ctx = out.getContext('2d');
      ctx.scale(dpr, dpr);
      ctx.fillStyle = '#1b1b20';
      ctx.fillRect(0, 0, W, H);

      const camera = new THREE.PerspectiveCamera(small ? 20 : 18, CW / CH, 0.05, 100);
      for (const [vi, v] of list.entries()) {
        const bx = vi * (BW + GAP);
        ctx.fillStyle = '#e8e2d0';
        ctx.font = 'bold 22px sans-serif';
        ctx.fillText(`${v.name}`, bx + 8, 30);
        ctx.font = '15px sans-serif';
        ctx.fillStyle = '#c8c0aa';
        if (!small) ctx.fillText(v.note ?? '', bx + 8 + ctx.measureText(v.name).width * 1.5 + 14, 30);
        const look = lookOf(who, v);
        for (const [i, [label, yaw, mode]] of views.entries()) {
          const p = createKayKitPuppet(look);
          scene.add(p.group);
          p.setYaw(yaw);
          const tweens = createTweens();
          let t = 0;
          if (mode === 'down' && who === 'touma') void playGesture(tweens, p, GESTURES['うつむく'], {});
          const stop = mode === 'down' && who === 'touma' ? GESTURES['うつむく'].seconds * 0.5 : 1.2;
          while (t < stop) {
            t += 1 / 30;
            tweens.update(1 / 30);
            p.update(t);
          }
          if (small) {
            // ゲームのカメラに近い見下ろし（約 35 度）
            const e = THREE.MathUtils.degToRad(35);
            camera.position.set(0, 0.42 + Math.sin(e) * 3.3, Math.cos(e) * 3.3);
            camera.lookAt(0, 0.42, 0);
          } else if (mode === 'down') {
            const e = THREE.MathUtils.degToRad(24);
            camera.position.set(0, 0.66 + Math.sin(e) * 1.75, Math.cos(e) * 1.75);
            camera.lookAt(0, 0.66, 0);
          } else if (trio) {
            camera.position.set(0, 0.7, 4.3);
            camera.lookAt(0, 0.6, 0);
          } else if (body) {
            camera.position.set(0, 0.6, 3.2);
            camera.lookAt(0, 0.45, 0);
            //
            camera.lookAt(0, 0.5, 0);
          } else {
            camera.position.set(0, 0.74, 1.75);
            camera.lookAt(0, 0.64, 0);
          }
          renderer.render(scene, camera);
          const col = i % COLS;
          const row = Math.floor(i / COLS);
          const x = bx + col * CW;
          const y = HEAD + row * CH;
          ctx.drawImage(renderer.domElement, x, y, CW, CH);
          ctx.fillStyle = '#000a';
          ctx.font = small ? '11px sans-serif' : '13px sans-serif';
          const tw = ctx.measureText(label).width;
          ctx.fillRect(x + 4, y + CH - (small ? 18 : 22), tw + 10, small ? 15 : 19);
          ctx.fillStyle = '#fff';
          ctx.fillText(label, x + 9, y + CH - (small ? 7 : 8));
          scene.remove(p.group);
        }
        // 案の区切り
        if (vi > 0) {
          ctx.fillStyle = '#e8e2d0';
          ctx.fillRect(bx - GAP / 2 - 1, 8, 2, H - 16);
        }
      }
      document.title = `${names[who]} ${round}`;
      window.done = true;
    </script>
  </body>
</html>
