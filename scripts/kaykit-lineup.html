<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>KayKit の人形の並び</title>
    <style>
      body { margin: 0; background: #1b1b20; color: #e8e2d0; font: 14px sans-serif; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script type="module">
      // KayKit の人形の試し: 作り分けと動きの確かめの写真を撮るための、開発用サーバーだけで開くページ（scripts/kaykit-lineup.mjs）。
      // ?mode=views 4人を正面・横・後ろ / mode=motions 仕草ごとの姿 / mode=parts 自作の部品の見本 / mode=skeleton 骸骨
      // &puppet=current で今の人形 &shade=plain で素材そのままの陰影 &light=dinner|night で場面4の光
      import * as THREE from 'three';
      import { createKayKitPuppet, loadKayKit, setKayKitShading } from '/src/render/kaykit.ts';
      import { createPuppet } from '/src/render/puppet.ts';
      import { LOOKS } from '/src/data/story/looks.ts';
      import { GESTURES, POSTURES } from '/src/data/story/stageDefs.ts';
      import { playGesture } from '/src/render/motion.ts';
      import { createTweens } from '/src/render/tweens.ts';

      const q = new URLSearchParams(location.search);
      const mode = q.get('mode') ?? 'views';
      const W = Number(q.get('w') ?? 1400);
      const H = Number(q.get('h') ?? 520);
      setKayKitShading(q.get('shade') === 'plain' ? 'plain' : 'toon');
      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x9a9080);
      scene.add(new THREE.HemisphereLight(0xc8d4ff, 0x4a3a30, 1.5));
      const sun = new THREE.DirectionalLight(0xffe2bc, 2.2);
      sun.position.set(1.5, 3, 4);
      scene.add(sun);
      // &light=dinner（夕方の室内と灯）・night（夜の室内と灯）: 場面4の光に近づけて撮る（目と髪が光に沈まないかの確かめ）
      const lightMode = q.get('light');
      if (lightMode) {
        const { TIMES_OF_DAY } = await import('/src/data/lighting.ts');
        const { applyLighting } = await import('/src/render/lighting.ts');
        const hemi = scene.children.find((o) => o.isHemisphereLight);
        applyLighting(scene, { hemi, sun }, TIMES_OF_DAY[lightMode === 'night' ? '夜' : '夕方'], undefined, lightMode === 'night' ? 0.55 : 0.7);
        const lamp = new THREE.PointLight(0xffb070, lightMode === 'night' ? 3.2 : 2.2, 6, 1.4);
        lamp.position.set(2, 1.4, 1.6);
        scene.add(lamp);
      }
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshLambertMaterial({ color: 0x6a5e4c }));
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);
      await loadKayKit();
      const make = (id, overrides) => {
        const look = { ...LOOKS[id], ...(overrides ?? {}) };
        return q.get('puppet') === 'current' ? createPuppet(look) : createKayKitPuppet(look);
      };
      const tweens = createTweens();
      const puppets = [];
      const labels = [];
      /** 人形を x の位置に置く */
      const place = (p, x, z = 0) => {
        p.group.position.set(x, 0, z);
        scene.add(p.group);
        puppets.push(p);
        return p;
      };
      const people = ['touma', 'yuna', 'father', 'mother'];
      const names = { touma: 'トウマ', yuna: 'ユナ', father: '父', mother: '母' };
      let span = 0;
      let t = 0;
      const step = (seconds) => {
        for (let k = 0; k < seconds * 30; k++) {
          t += 1 / 30;
          tweens.update(1 / 30);
          for (const p of puppets) p.update(t);
        }
      };
      if (mode === 'views') {
        // 4人を正面・横・後ろから（向きごとに組にして並べる）
        const yaws = [0, Math.PI / 2, Math.PI];
        let i = 0;
        for (const [r, y] of yaws.entries())
          for (const id of people) {
            const p = place(make(id), i * 0.5 + r * 0.35);
            p.setYaw(y);
            labels.push({ x: p.group.position.x, text: `${names[id]}・${['正面', '横', '後ろ'][r]}` });
            i++;
          }
        span = (i - 1) * 0.5 + 0.7 + 0.7;
        step(1.2);
      } else if (mode === 'closeup') {
        // 1人を5つの向き（正面・斜め前・横・斜め後ろ・後ろ）から近くで（frame=head で頭と肩、body で全身）
        const id = q.get('who') ?? 'yuna';
        const views = [
          ['正面', 0],
          ['斜め前', 0.7],
          ['横', Math.PI / 2],
          ['斜め後ろ', 2.4],
          ['後ろ', Math.PI],
        ];
        const gap = q.get('frame') === 'body' ? 0.5 : 0.46;
        views.forEach(([label, yaw], i) => {
          const p = place(make(id), i * gap);
          p.setYaw(yaw);
          labels.push({ x: i * gap, text: `${names[id] ?? id}・${label}` });
        });
        span = (views.length - 1) * gap + gap;
        step(1.2);
      } else if (mode === 'face') {
        // 顔を寄せて: 4人（who=touma,yuna,... で選べる）を、正面・斜め・横の3つの向きから。目・眉・鼻の確かめ
        const ids = (q.get('who') ?? people.join(',')).split(',');
        // &yaws=0.3,0.6 で向きを選ぶ
        const views = q.get('yaws')
          ? q.get('yaws').split(',').map((y) => [y, Number(y)])
          : [
              ['正面', 0],
              ['斜め', 0.75],
              ['横', Math.PI / 2],
            ];
        const gap = 0.3;
        let i = 0;
        for (const id of ids)
          for (const [label, yaw] of views) {
            const p = place(make(id), i * gap + Math.floor(i / 3) * 0.08);
            // &flip=1 で反対の向きから（右と左の両方の頬を確かめる）
            p.setYaw(q.get('flip') ? -yaw : yaw);
            labels.push({ x: p.group.position.x, text: `${names[id] ?? id}・${label}` });
            i++;
          }
        span = (i - 1) * gap + Math.floor((i - 1) / 3) * 0.08 + gap;
        step(1.2);
      } else if (mode === 'hairs') {
        // 髪型を増やす試作（ゲームには入れない）: 作者の髪3種を土台に、変形（長さ・量・分け目）と大きな塊の付け足しで作った髪。
        // set=base で土台の3種、set=new で試作。どれも同じ体（rogue）と顔で、正面・斜め・後ろから
        const skin = 0xc2a18a;
        const sets = {
          base: [
            ['土台: 短い（knight）', { head: 'knight', hair: { kit: 'knight', color: 0x3a2c24 } }],
            ['土台: 中くらい（rogue）', { head: 'rogue', hair: { kit: 'rogue', color: 0x3a2c24 } }],
            ['土台: 長い（mage）', { head: 'mage', hair: { kit: 'mage', color: 0x3a2c24 } }],
          ],
          new: [
            ['試作1: 後ろで1つに結ぶ', { head: 'mage', hair: { kit: 'mage', color: 0x4a3426, extras: ['ponytail'] }, accent: 0x7a5a3a }],
            ['試作2: 短い髪を立たせる', { head: 'knight', hair: { kit: 'knight', color: 0x6a4a2e, shape: { lift: 0.05, volume: 1.03 } } }],
            ['試作3: 肩までの髪', { head: 'rogue', hair: { kit: 'rogue', color: 0x2a2226, shape: { length: 1.45, mirror: true } } }],
            ['帽子と組み合わせ（短い髪に1つ結び）', { head: 'knight', hair: { kit: 'knight', color: 0x8a6a44, extras: ['ponytail'] }, headwear: { kind: 'hat', color: 0x5e4430 }, accent: 0x8a6a3a }],
          ],
        };
        const list = sets[q.get('set') ?? 'new'];
        const views = [
          ['正面', 0],
          ['斜め', 0.75],
          ['後ろ', Math.PI],
        ];
        const gap = 0.36;
        let i = 0;
        for (const [label, o] of list) {
          for (const [vl, yaw] of views) {
            const k = { base: 'rogue', skin, cloth: 0x6a6050, cloth2: 0x5a5244, pants: 0x4a3e30, face: { brows: 'thin' }, ...o };
            const p = place(make('touma', { kaykit: k, items: [] }), i * gap + Math.floor(i / 3) * 0.14);
            p.setYaw(yaw);
            labels.push({ x: p.group.position.x, text: vl === '正面' ? `${label}・${vl}` : vl });
            i++;
          }
        }
        span = (i - 1) * gap + Math.floor((i - 1) / 3) * 0.14 + gap + 0.3;
        step(1.2);
      } else if (mode === 'motions') {
        // 仕草ごとの姿（動きの途中で止めた画）。1人の人物で、横に並べる
        const id = q.get('who') ?? 'yuna';
        const list = [
          ['立つ', null, 0],
          ['歩く（途中）', 'walk', 0.5],
          ['振り向く', '振り向く', 0.5],
          ['うなずく', 'うなずく', 0.4],
          ['顔を上げる', '顔を上げる', 0.6],
          ['しゃがむ（拾う）', '拾う', 0.45],
          ['座る', 'sit', 0],
          ['物を持つ', 'hold', 0],
          ['物を置く', '物を置く', 0.45],
        ];
        list.forEach(([label, how, at], i) => {
          const p = place(make(id), i * 0.55);
          p.setYaw(0.5);
          labels.push({ x: i * 0.55, text: label });
          if (how === 'walk') p.setMoving(true);
          else if (how === 'sit') p.setPose(POSTURES['座る']);
          else if (how === 'hold') p.setItems({ hand: q.get('item') ?? 'lampSmall' });
          else if (how) {
            const g = GESTURES[how];
            void playGesture(tweens, p, g, {});
            p.__stopAt = at * g.seconds;
          }
        });
        span = (list.length - 1) * 0.55 + 0.8;
        // 仕草の途中（at の割合）まで進めて止める
        const longest = Math.max(...puppets.map((p) => p.__stopAt ?? 0.6));
        for (let k = 0; k < longest * 30; k++) {
          t += 1 / 30;
          tweens.update(1 / 30);
          for (const p of puppets) if ((p.__stopAt ?? 0.6) >= t) p.update(t);
        }
      } else if (mode === 'gest') {
        // 頭と肩を、ゲームのカメラに近い見下ろし（elev 度）から、仕草の途中で止めて並べる（前髪がうつむくと目元にかかるか、動きで不自然に跳ねないかの確かめ）。
        // who=人物、set=bow（うつむきの仕草）・move（場面4で使う動き）
        const id = q.get('who') ?? 'touma';
        const sets = {
          bow: [
            ['立つ', null, 0],
            ['うつむく（途中）', 'うつむく', 0.2],
            ['うつむく', 'うつむく', 0.5],
            ['うつむいたまま', 'posture:うつむいたまま', 0],
            ['うなずく（場面4）', 'うなずく', 0.4],
            ['足を止める（場面0）', '足を止める', 0.4],
          ],
          move: [
            ['歩く（途中）', 'walk', 0.5],
            ['振り向く', '振り向く', 0.5],
            ['戸を開ける', '戸を開ける', 0.5],
            ['座る', 'sit', 0],
            ['物を持つ（灯）', 'hold', 0],
            ['拾う（途中）', '拾う', 0.45],
            ['顔を上げる', '顔を上げる', 0.6],
          ],
        };
        const list = sets[q.get('set') ?? 'bow'];
        const gap = 0.42;
        list.forEach(([label, how, at], i) => {
          const p = place(make(id), i * gap);
          p.setYaw(Number(q.get('yaw') ?? 0.35));
          labels.push({ x: i * gap, text: label });
          if (how === 'walk') p.setMoving(true);
          else if (how === 'sit') p.setPose(POSTURES['座る']);
          else if (how === 'hold') p.setItems({ hand: 'lampSmall' });
          else if (how && how.startsWith('posture:')) p.setPose(POSTURES[how.slice(8)]);
          else if (how) {
            const g = GESTURES[how];
            void playGesture(tweens, p, g, {});
            p.__stopAt = at * g.seconds;
          }
        });
        span = (list.length - 1) * gap + gap;
        const longest = Math.max(...puppets.map((p) => p.__stopAt ?? 1.2));
        for (let k = 0; k < longest * 30 + 1; k++) {
          t += 1 / 30;
          tweens.update(1 / 30);
          for (const p of puppets) if ((p.__stopAt ?? 1.2) >= t) p.update(t);
        }
      } else if (mode === 'compare') {
        // 見分けの比べ: トウマと、見比べ用に仮で作った頭（ゲームには入れない）を並べる。正面・斜め・後ろ
        const skin = 0xc2a18a;
        const others = {
          // ジン: 竜騎士の若者。設計書「仮 十九歳・仮 長身・仮 跳ねた赤茶の髪・仮 革の茶に竜の鱗の飾り」
          jin: { base: 'rogue', head: 'rogue', height: 1.04, skin: 0xc09a80, cloth: 0x6a4a34, cloth2: 0x553a28, leather: 0x4a3426, pants: 0x3e3228, hair: { kit: 'knight', color: 0x8a4428, shape: { lift: 0.07, volume: 1.05 }, extras: ['flareUp'] }, face: { brows: 'thick' }, accent: 0x7a6a3a },
          // テオ: 若い時守。設計書「仮 十七歳・仮 小柄・仮 柔らかい茶髪・仮 時守の濃紺に白い襟」
          teo: { base: 'rogue', head: 'rogue', height: 0.92, width: 0.92, skin: 0xc8a993, cloth: 0x2e3546, cloth2: 0x262c3a, pants: 0x2e2c2c, hair: { kit: 'rogue', color: 0x7a5a40, shape: { length: 0.55, volume: 1.06, fringe: 1.15 } }, face: { brows: 'thin', round: true }, accent: 0xd8d2c0 },
        };
        const list = [
          ['トウマ', LOOKS.touma.kaykit],
          ['ジン（仮）', others.jin],
          ['テオ（仮）', others.teo],
        ];
        const views = [
          ['正面', 0],
          ['斜め', 0.75],
          ['後ろ', Math.PI],
        ];
        const gap = Number(q.get('gap') ?? 0.42);
        let i = 0;
        const byView = q.get('by') === 'view';
        const order = byView ? views.flatMap((v) => list.map((l) => [l, v])) : list.flatMap((l) => views.map((v) => [l, v]));
        for (const [[label, k], [vl, yaw]] of order) {
          const p = place(make('touma', { kaykit: { ...k, skin: k.skin ?? skin }, items: [] }), i * gap + Math.floor(i / 3) * 0.12);
          p.setYaw(yaw);
          // 小さい写真（スマホで人物が映る大きさ）では、札を名前の頭の1字だけにする
          labels.push({ x: p.group.position.x, text: W < 600 ? label[0] : `${label}・${vl}` });
          i++;
        }
        span = (i - 1) * gap + Math.floor((i - 1) / 3) * 0.12 + gap;
        step(1.2);
      } else if (mode === 'parts') {
        // 自作の部品の見本: 髪の4種類・頭巾・帽子・肩掛け・マント・前掛け
        const base = LOOKS.touma.kaykit;
        const samples = [
          ['髪: knight', { hair: { kit: 'knight', color: 0x2a2220 } }],
          ['髪: rogue', { head: 'rogue', hair: { kit: 'rogue', color: 0x2a2220 } }],
          ['髪: mage', { head: 'mage', hair: { kit: 'mage', color: 0x4a3426 } }],
          ['髪: はげ頭に knight の髪', { head: 'barbarian', hair: { kit: 'knight', color: 0x5a4430 } }],
          ['頭巾', { headwear: { kind: 'hood', color: 0x5a5244 } }],
          ['帽子', { headwear: { kind: 'hat', color: 0x5e4430 }, accent: 0x8a6a3a }],
          ['肩掛け', { mantle: 0x6a604e }],
          ['マント（外套）', { cloak: { color: 0x2b3346, length: 'long', hoodDown: true } }],
          ['前掛け', { apron: { color: 0xbdb091, bib: true } }],
        ];
        samples.forEach(([label, o], i) => {
          const k = { base: 'rogue', skin: base.skin, cloth: 0x7a6c5c, hair: { kit: 'knight', color: 0x2a2220 }, ...o };
          const p = place(make('touma', { kaykit: k }), i * 0.55);
          p.setYaw(i % 2 ? 0.6 : -0.6);
          labels.push({ x: i * 0.55, text: label });
        });
        span = (samples.length - 1) * 0.55 + 0.8;
        step(1.2);
      } else if (mode === 'skeleton') {
        // 骸骨（素材そのまま。物語の場面と戦闘には入れない）
        const { GLTFLoader } = await import('three/examples/jsm/loaders/GLTFLoader.js');
        const files = ['Skeleton_Minion', 'Skeleton_Warrior', 'Skeleton_Mage', 'Skeleton_Rogue'];
        const dir = q.get('dir') ?? '/.lab/';
        const mixers = [];
        for (const [i, f] of files.entries()) {
          const g = await new GLTFLoader().loadAsync(`${dir}${f}.glb`);
          const o = g.scene;
          o.scale.setScalar(0.42);
          o.position.x = i * 0.9;
          o.rotation.y = 0.4;
          o.traverse((x) => {
            if (x.isMesh && !x.isSkinnedMesh) x.visible = false;
          });
          scene.add(o);
          const m = new THREE.AnimationMixer(o);
          const clip = g.animations.find((a) => a.name === (q.get('anim') ?? 'Idle'));
          if (clip) m.clipAction(clip).play();
          m.update(0.6);
          mixers.push(m);
          labels.push({ x: i * 0.9, text: f });
        }
        span = 3 * 0.9 + 1.2;
      }
      // 並びの幅が画面の横に収まる距離から、少し見下ろす
      const camera = new THREE.PerspectiveCamera(20, W / H, 0.1, 100);
      const headShot = (mode === 'closeup' && q.get('frame') !== 'body') || mode === 'face' || mode === 'hairs' || mode === 'gest' || mode === 'compare';
      const xs = puppets.length ? puppets.map((p) => p.group.position.x) : labels.map((l) => l.x);
      const cx = (Math.min(...xs) + Math.max(...xs)) / 2;
      const hfov = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(10)) * (W / H));
      const dist = Math.max(span / 2 / Math.tan(hfov / 2), mode === 'face' || mode === 'hairs' ? Number(q.get('dist') ?? 1.75) : 2.2);
      if ((mode === 'gest' || mode === 'compare') && q.get('elev')) {
        // ゲームのカメラに近い見下ろし（elev 度）。頭の高さを見る
        const e = THREE.MathUtils.degToRad(Number(q.get('elev')));
        const cyy = Number(q.get('cy') ?? 0.66);
        camera.position.set(cx, cyy + Math.sin(e) * dist, Math.cos(e) * dist);
        camera.lookAt(cx, cyy, 0);
      } else if (mode === 'face' || mode === 'hairs') {
        // 顔: 目の高さから、ほぼ水平に
        const eye = Number(q.get('cy') ?? 0.74);
        camera.position.set(cx, eye, dist);
        camera.lookAt(cx, eye - 0.02, 0);
      } else if (headShot) {
        // 頭と肩: ほぼ水平に、頭の高さを見る
        camera.position.set(cx, 0.78, dist);
        camera.lookAt(cx, 0.68, 0);
      } else {
        camera.position.set(cx, 0.5 + dist * 0.12, dist);
        camera.lookAt(cx, 0.45, 0);
      }
      renderer.render(scene, camera);
      // 名前の札（画面の下に）
      const ctx = document.createElement('canvas').getContext('2d');
      for (const l of labels) {
        const v = new THREE.Vector3(l.x, 0, 0).project(camera);
        const d = document.createElement('div');
        d.textContent = l.text;
        if (headShot) v.copy(new THREE.Vector3(l.x, 0.5, 0).project(camera));
        if (mode === 'face') v.copy(new THREE.Vector3(l.x, 0.6, 0).project(camera));
        if (mode === 'hairs') v.copy(new THREE.Vector3(l.x, 0.44, 0).project(camera));
        if (mode === 'gest' || mode === 'compare') v.copy(new THREE.Vector3(l.x, 0.4, 0).project(camera));
        d.style.cssText = `position:absolute;top:${H - 30}px;left:${((v.x + 1) / 2) * W}px;transform:translateX(-50%);background:#000a;padding:2px 6px;border-radius:4px;white-space:nowrap`;
        document.body.append(d);
      }
      void ctx;
      window.done = true;
    </script>
  </body>
</html>
