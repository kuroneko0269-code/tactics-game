# PR（変更の提案）が出るたびに、lint・型チェック・テスト・ビルドと、自動プレイ（実際のブラウザで1戦を進める確認）を自動実行する。
# ジョブ名 check は main のルールで「必須の検査」に指定されているので、変えないこと。
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint（書き方と依存方向の検査）
        run: npm run lint
      - name: 型チェック
        run: npm run typecheck
      - name: テスト
        run: npm test
      - name: ビルド
        run: npm run build
      - name: 自動プレイ用のブラウザ（Chromium）を用意
        run: npx playwright install --with-deps --only-shell chromium
      - name: 自動プレイ（スマホ縦向き・横向きで1戦を最後まで）
        run: npm run autoplay
      - name: 自動プレイが失敗した時の画面写真を保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: autoplay-failure
          path: autoplay-output/
          if-no-files-found: ignore
